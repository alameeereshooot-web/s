<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>AlameeereTv</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #000;
  color: #fff;
  font-family: system-ui, sans-serif;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}
header {
  background: #111;
  padding: 12px;
  text-align: center;
  border-bottom: 1px solid #222;
}
header h1 {
  font-size: 18px;
  color: #0f0;
  letter-spacing: 2px;
}
#player-wrap {
  position: relative;
  width: 100%;
  background: #000;
  aspect-ratio: 16/9;
  max-height: 60vh;
}
#video {
  width: 100%;
  height: 100%;
  display: block;
  background: #000;
}
#status {
  padding: 10px 15px;
  background: #111;
  color: #aaa;
  font-size: 13px;
  text-align: center;
  border-bottom: 1px solid #222;
}
#status.error { color: #f44; }
#status.ok { color: #0f0; }
#status.loading { color: #ff0; }
#channels {
  flex: 1;
  overflow-y: auto;
  padding: 10px;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
  gap: 8px;
}
.ch {
  background: #1a1a1a;
  border: 2px solid #333;
  border-radius: 8px;
  padding: 10px;
  cursor: pointer;
  transition: .2s;
  text-align: center;
  color: #fff;
  font-size: 13px;
}
.ch:hover { border-color: #0f0; background: #222; }
.ch.active { border-color: #0f0; background: #1a3a1a; }
.ch small { display: block; color: #888; font-size: 10px; margin-top: 4px; }
</style>
</head>
<body>

<header>
  <h1>AlameeereTv</h1>
</header>

<div id="player-wrap">
  <video id="video" controls autoplay playsinline muted></video>
</div>

<div id="status">اختر قناة للبدء</div>

<div id="channels"></div>

<script>
// ==================== البروكسي ====================
var PROXY = 'https://l.alameeeretv.workers.dev/?url=';

function proxied(url) {
  return PROXY + encodeURIComponent(url);
}

// ==================== القنوات ====================
var CHANNELS = [
  { n: 'beIN 1 SD', u: proxied('http://vip2.sharkhost.xyz:80/live/9143315182/7352465335/212349.m3u8') },
  { n: 'beIN 2 SD', u: proxied('http://vip2.sharkhost.xyz:80/live/9143315182/7352465335/212350.m3u8') },
  { n: 'beIN 3 SD', u: proxied('http://vip2.sharkhost.xyz:80/live/9143315182/7352465335/212352.m3u8') },
  { n: 'beIN 4 SD', u: proxied('http://vip2.sharkhost.xyz:80/live/9143315182/7352465335/212353.m3u8') },
  { n: 'beIN 5 SD', u: proxied('http://vip2.sharkhost.xyz:80/live/9143315182/7352465335/212354.m3u8') },
  { n: 'beIN 6 SD', u: proxied('http://vip2.sharkhost.xyz:80/live/9143315182/7352465335/212355.m3u8') },
  { n: 'beIN 7 SD', u: proxied('http://vip2.sharkhost.xyz:80/live/9143315182/7352465335/212356.m3u8') },
  { n: 'beIN XTRA 1', u: proxied('http://vip2.sharkhost.xyz:80/live/9143315182/7352465335/653845.m3u8') },
  { n: 'beIN XTRA 2', u: proxied('http://vip2.sharkhost.xyz:80/live/9143315182/7352465335/653844.m3u8') },
  { n: 'beIN XTRA 3', u: proxied('http://vip2.sharkhost.xyz:80/live/9143315182/7352465335/653843.m3u8') }
];

// ==================== المشغل ====================
var video = document.getElementById('video');
var statusEl = document.getElementById('status');
var channelsEl = document.getElementById('channels');
var hls = null;
var currentBtn = null;

function setStatus(text, type) {
  statusEl.textContent = text;
  statusEl.className = type || '';
}

function playChannel(ch, btn) {
  // إيقاف القديم
  if (hls) {
    hls.destroy();
    hls = null;
  }
  video.removeAttribute('src');
  video.load();

  // تفعيل الزر
  if (currentBtn) currentBtn.classList.remove('active');
  currentBtn = btn;
  if (btn) btn.classList.add('active');

  setStatus('جاري التحميل: ' + ch.n, 'loading');

  var url = ch.u;

  // Safari / iOS
  if (video.canPlayType('application/vnd.apple.mpegurl')) {
    video.src = url;
    video.addEventListener('loadedmetadata', function() {
      setStatus('يعمل: ' + ch.n, 'ok');
      video.play().catch(function(){});
    }, { once: true });
    video.addEventListener('error', function() {
      setStatus('فشل التشغيل: ' + ch.n, 'error');
    }, { once: true });
    return;
  }

  // HLS.js
  if (Hls.isSupported()) {
    hls = new Hls({
      enableWorker: true,
      lowLatencyMode: true,
      backBufferLength: 30
    });
    hls.loadSource(url);
    hls.attachMedia(video);

    hls.on(Hls.Events.MANIFEST_PARSED, function() {
      setStatus('يعمل: ' + ch.n, 'ok');
      video.play().catch(function(){});
    });

    hls.on(Hls.Events.ERROR, function(event, data) {
      if (data.fatal) {
        setStatus('خطأ: ' + data.type + ' - ' + (data.details || ''), 'error');
        console.error('HLS Error:', data);
      }
    });
  } else {
    setStatus('المتصفح لا يدعم HLS', 'error');
  }
}

// ==================== بناء قائمة القنوات ====================
CHANNELS.forEach(function(ch) {
  var btn = document.createElement('button');
  btn.className = 'ch';
  btn.innerHTML = ch.n + '<small>اضغط للتشغيل</small>';
  btn.onclick = function() { playChannel(ch, btn); };
  channelsEl.appendChild(btn);
});
</script>

</body>
</html>
