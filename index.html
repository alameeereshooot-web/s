            color: #fff;
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 2px;
        }
        #player-wrap.playing #brand-overlay {
            opacity: 0;
            z-index: -1;
        }

        #loader {
            position: absolute;
            inset: 0;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            background: rgba(0,0,0,.75);
            z-index: 10;
        }
        #loader .wave-text {
            color: #fff;
            font-size: 26px;
            font-weight: 700;
            letter-spacing: 2px;
            animation: wave 1.5s ease-in-out infinite;
        }
        @keyframes wave {
            0%, 100% { transform: translateY(0); text-shadow: 0 0 10px rgba(255,255,255,.4); }
            25% { transform: translateY(-6px); text-shadow: 0 0 20px rgba(255,255,255,.8); }
            50% { transform: translateY(0); text-shadow: 0 0 10px rgba(255,255,255,.4); }
