            // manar2 賷毓賲賱 毓亘乇 亘乇賵賰爻賷 賰賱丕賵丿賮賱賷乇.
            if (url.indexOf('://www.manar2.shop/') !== -1 || url.indexOf('://manar2.shop/') !== -1) {
                return HLS_PROXY + encodeURIComponent(url);
            }
            return url;
        }

        function loadHls(url, name) {
            url = getPlayableUrl(url);
            if (window.location.protocol === 'https:' && url.startsWith('http://')) {
                url = url.replace('http://', 'https://');
            }
            vid.style.display = 'block';
            iframeWrap.style.display = 'none';
            iframePlayer.src = '';
            showLoader();
            if (hls) { hls.destroy(); hls = null; }
            vid.removeAttribute('src');
            vid.load();
            if (Hls.isSupported()) {
                hls = new Hls({
                    enableWorker: true,
                    startLevel: 0,
                    autoLevelEnabled: false,
                    capLevelToPlayerSize: false,
                    maxBufferLength: 10,
                    maxMaxBufferLength: 30,
                    maxBufferSize: 20 * 1000 * 1000,
                    manifestLoadingMaxRetry: 4,
                    manifestLoadingRetryDelay: 500,
                    levelLoadingMaxRetry: 4,
                    fragLoadingMaxRetry: 4,
                    fragLoadingRetryDelay: 500,
                    liveSyncDurationCount: 2,
                    liveMaxLatencyDurationCount: 4,
                    lowLatencyMode: true
                });
                hls.loadSource(url);
                hls.attachMedia(vid);
                hls.on(Hls.Events.MANIFEST_PARSED, function () {
                    hls.currentLevel = 0;
                    hls.autoLevelEnabled = false;
                    hideLoader();
                    pw.classList.add('playing');
                    vid.play().catch(function () { });
                    buildQ();
                });
                hls.on(Hls.Events.FRAG_BUFFERED, function () { hideLoader(); });
                hls.on(Hls.Events.ERROR, function (e, d) {
                    if (d.fatal) {
                        if (d.type === Hls.ErrorTypes.NETWORK_ERROR) {
                            showLoader();
                            hls.startLoad();
                            retryT = setTimeout(function () { load(cur.r, cur.i); }, 5000);
                        } else if (d.type === Hls.ErrorTypes.MEDIA_ERROR) {
                            hls.recoverMediaError();
                        } else {
                            retryT = setTimeout(function () { load(cur.r, cur.i); }, 5000);
                        }
                    }
                });
            } else if (vid.canPlayType('application/vnd.apple.mpegurl')) {
                vid.src = url;
                vid.addEventListener('loadeddata', function () { hideLoader(); pw.classList.add('playing'); }, { once: true });
                vid.play().catch(function () { });
            } else {
                hideLoader();
                toast('丕賱賲鬲氐賮丨 睾賷乇 賲鬲賵丕賮賯');
            }
        }

        function buildChannels() {
            ROWS.forEach(function (row, ri) {
                var box = document.getElementById('row-' + ri);
                if (!box) return;
                box.innerHTML = '';
                row.channels.forEach(function (c, ci) {
                    var b = document.createElement('button');
                    var cls = 'ch';
                    if (c.t === 'iframe') cls += ' iframe-ch';
                    if (c.t === 'ts') cls += ' ts-ch';
                    if (row.special) cls += ' multi-ch';
                    b.className = cls;
                    b.textContent = c.n;
                    b.id = 'ch-' + ri + '-' + ci;
                    b.onclick = function () { load(ri, ci); };
                    box.appendChild(b);
                });
            });
        }

        function openWithMPV(url) {
            var rawUrl = url;
            var cleanUrl = url.replace(/^https?:\/\//, '');
            var ua = navigator.userAgent;

            var isAndroid = /Android/i.test(ua);
            var isIOS = /iPhone|iPad|iPod/i.test(ua);

            if (isAndroid) {
                var androidIntents = [
                    'intent://' + cleanUrl + '#Intent;scheme=http;type=video/*;action=android.intent.action.VIEW;end',
                    'mpv://' + cleanUrl,
                    'intent://' + cleanUrl + '#Intent;scheme=http;type=video/*;package=is.xyz.mpv;action=android.intent.action.VIEW;end',
                    'intent://' + cleanUrl + '#Intent;scheme=http;type=video/*;package=info.t4w.vp;action=android.intent.action.VIEW;end',
                    'vlc://' + cleanUrl,
                    'intent://' + cleanUrl + '#Intent;scheme=http;type=video/*;package=org.videolan.vlc;action=android.intent.action.VIEW;end',
                    'intent://' + cleanUrl + '#Intent;scheme=http;type=video/*;package=com.mxtech.videoplayer.ad;action=android.intent.action.VIEW;end'
                ];

                var idx = 0;
                function tryAndroidIntent() {
                    if (idx >= androidIntents.length) {
                        toast('鬲毓匕乇 賮鬲丨 丕賱賲卮睾賱貙 賷乇噩賶 丕賱鬲兀賰丿 賲賳 鬲孬亘賷鬲 賲卮睾賱 賮賷丿賷賵 毓賱賶 噩賴丕夭賰');
                        return;
                    }
                    var target = androidIntents[idx++];
                    window.location.href = target;

                    setTimeout(function() {
                        if (!document.hidden) {
                            tryAndroidIntent();
                        }
                    }, 600);
                }
                tryAndroidIntent();

            } else if (isIOS) {
                var encodedUrl = encodeURIComponent(rawUrl);
                var primaryUrl = 'vlc-x-callback://x-callback-url/stream?url=' + encodedUrl;
                
                try {
                    window.location.href = primaryUrl;
                } catch (e) {
                    toast('賷乇噩賶 丕賱鬲兀賰丿 賲賳 鬲孬亘賷鬲 鬲胤亘賷賯 VLC 兀賵 Outplayer 賲賳 App Store');
                }

                setTimeout(function() {
                    if (!document.hidden) {
                        toast('賱賲 賷鬲賲 賮鬲丨 丕賱賲卮睾賱貙 賴賱 鬲胤亘賷賯 VLC 賲孬亘鬲 賱丿賷賰責');
                    }
                }, 2000);

            } else {
                var pcProtocols = [
                    'potplayer://' + rawUrl,
                    'vlc://' + rawUrl,
                    'mpv://' + cleanUrl
                ];

                var pcIdx = 0;
                function tryPCProtocol() {
                    if (pcIdx >= pcProtocols.length) {
                        toast('鬲毓匕乇 賮鬲丨 丕賱賲卮睾賱貙 賷乇噩賶 鬲孬亘賷鬲 PotPlayer 兀賵 VLC 毓賱賶 噩賴丕夭賰');
                        return;
                    }
                    var target = pcProtocols[pcIdx++];
                    window.location.href = target;

                    setTimeout(function() {
                        if (!document.hidden) {
                            tryPCProtocol();
                        }
                    }, 700);
                }
                tryPCProtocol();
            }
        }

        function load(ri, ci) {
            if (ri < 0 || ri >= ROWS.length || ci < 0 || ci >= ROWS[ri].channels.length) return;
            cur = { r: ri, i: ci };
            if (retryT) { clearTimeout(retryT); retryT = null; }
            document.querySelectorAll('.ch').forEach(function (b) { b.classList.remove('on'); });
            var btn = document.getElementById('ch-' + ri + '-' + ci);
            if (btn) btn.classList.add('on');
            var ch = ROWS[ri].channels[ci];
            chTitle.textContent = ch.n;
            chTitle.style.display = 'block';
            var type = ch.t || 'hls';

            if (type === 'ts') {
                openWithMPV(ch.u);
                return;
            }

            if (type === 'iframe') {
                if (hls) { hls.destroy(); hls = null; }
                vid.style.display = 'none';
                iframeWrap.style.display = 'block';
                pw.classList.add('playing');
                showLoader();
                iframePlayer.src = '';
                setTimeout(function () { iframePlayer.src = ch.u; hideLoader(); }, 400);
                qm.innerHTML = '';
                return;
            }

            loadHls(ch.u, ch.n);
        }

        function buildQ() {
            qm.innerHTML = '';
            if (!hls) return;
            var lvls = hls.levels;
            if (!lvls || !lvls.length) return;
            var a = document.createElement('button');
            a.textContent = '鬲賱賯丕卅賷';
            a.onclick = function () {
                hls.currentLevel = -1;
                hls.autoLevelEnabled = true;
                qBtn.classList.remove('manual');
                updateQActive();
                closeQ();
            };
            qm.appendChild(a);
            lvls.forEach(function (lv, i) {
                var b = document.createElement('button');
                var lbl = lv.height ? lv.height + 'p' : Math.round(lv.bitrate / 1000) + 'k';
                b.textContent = lbl;
                b.onclick = function () {
                    hls.autoLevelEnabled = false;
                    hls.currentLevel = i;
                    qBtn.classList.add('manual');
                    updateQActive();
                    closeQ();
                };
                qm.appendChild(b);
            });
            updateQActive();
        }
        function updateQActive() {
            if (!hls) return;
            var btns = qm.querySelectorAll('button');
            btns.forEach(function (b, i) {
                if (i === 0) b.classList.toggle('active', hls.currentLevel === -1);
                else b.classList.toggle('active', hls.currentLevel === (i - 1));
            });
        }
        function closeQ() { qm.classList.remove('open'); }
        function toggleQ() {
            if (!hls && !qm.innerHTML) { return; }
            qm.classList.toggle('open');
            if (qm.classList.contains('open')) updateQActive();
        }
        function togglePlay() { vid.paused ? vid.play() : vid.pause(); }
        function toggleMute() {
            vid.muted = !vid.muted;
            document.getElementById('mute-btn').textContent = vid.muted ? '馃攪' : '馃攰';
            document.getElementById('vs').value = vid.muted ? 0 : vid.volume;
        }
        function setVolume(v) {
            vid.volume = parseFloat(v);
            vid.muted = v == 0;
            document.getElementById('mute-btn').textContent = v == 0 ? '馃攪' : '馃攰';
            document.getElementById('vs').value = v;
            localStorage.setItem('vol', v);
        }
        function skip(s) { vid.currentTime += s; }

        var swType = null, swStartY = 0, swStartVal = 0, swTimer = null, isSwiping = false, tyStart = 0;
        function showSwipe(type, val) {
            clearTimeout(swTimer);
            if (type === 'vol') {
                siIcon.textContent = '馃攰';
                siLabel.textContent = '丕賱氐賵鬲 ' + Math.round(val * 100) + '%';
                siBar.style.width = (val * 100) + '%';
                siBar.style.background = '#0f0';
            } else {
                siIcon.textContent = '鈽€锔�';
                siLabel.textContent = '丕賱廿囟丕亍丞 ' + Math.round((1 - val / 0.85) * 100) + '%';
                siBar.style.width = ((1 - val / 0.85) * 100) + '%';
                siBar.style.background = '#fbbf24';
            }
            swInd.style.display = 'flex';
            swTimer = setTimeout(function () { swInd.style.display = 'none'; }, 1200);
        }

        var lastTap = 0, dblTimer = null, dblHintTimer = null;
        function showDblHint(txt) {
            dblTxt.textContent = txt;
            dblHint.classList.add('show');
            clearTimeout(dblHintTimer);
            dblHintTimer = setTimeout(function () { dblHint.classList.remove('show'); }, 1500);
        }
        var hideCtrlT = null;

        document.addEventListener('touchend', function (e) {
            if (e.target.closest('#controls-overlay') || e.target.closest('#ch-rows') || e.target.closest('#qm') || e.target.closest('#speed-badge') || e.target.closest('#iframe-wrap')) return;
            if (isSwiping) return;
            var now = Date.now();
            if (now - lastTap < 400 && lastTap > 0) {
                lastTap = 0;
                clearTimeout(dblTimer);
                dblTimer = null;
                doFullscreen();
                showDblHint('鉀� 卮丕卮丞 賰丕賲賱丞');
            } else {
                lastTap = now;
                clearTimeout(dblTimer);
                if (e.target.closest('#player-wrap')) {
                    dblTimer = setTimeout(function () {
                        lastTap = 0;
                        pw.classList.add('show-ctrl');
                        clearTimeout(hideCtrlT);
                        hideCtrlT = setTimeout(function () { pw.classList.remove('show-ctrl'); }, 3000);
                    }, 400);
                }
            }
        }, { passive: true });

        pw.addEventListener('touchstart', function (e) {
            if (e.target.closest('#controls-overlay') || e.target.closest('#loader') || e.target.closest('#speed-badge') || e.target.closest('#iframe-wrap')) return;
            var t = e.touches[0];
            tyStart = t.clientY;
            isSwiping = false;
            var rect = pw.getBoundingClientRect();
            swType = (t.clientX - rect.left) > (rect.width / 2) ? 'vol' : 'brightness';
            swStartY = t.clientY;
            swStartVal = swType === 'vol' ? vid.volume : brightness;
        }, { passive: true });

        pw.addEventListener('touchmove', function (e) {
            if (!swType || e.target.closest('#controls-overlay') || e.target.closest('#iframe-wrap')) return;
            var t = e.touches[0];
            var dy = tyStart - t.clientY;
            if (!isSwiping && Math.abs(dy) > 12) isSwiping = true;
            if (!isSwiping) return;
            var delta = dy / pw.getBoundingClientRect().height;
            if (swType === 'vol') {
                var v = Math.max(0, Math.min(1, swStartVal + delta));
                setVolume(v);
                showSwipe('vol', v);
            } else {
                var b = Math.max(0, Math.min(0.85, swStartVal - delta));
                brightness = b;
                brightL.style.opacity = b;
                localStorage.setItem('brightness', b);
                showSwipe('brightness', b);
            }
        }, { passive: true });

        pw.addEventListener('touchend', function () {
            swType = null;
            setTimeout(function () { isSwiping = false; }, 50);
        }, { passive: true });

        pw.addEventListener('click', function (e) {
            if (e.target.closest('#controls-overlay') || e.target.closest('#loader') || e.target.closest('#speed-badge') || e.target.closest('#iframe-wrap')) return;
            pw.classList.add('show-ctrl');
            clearTimeout(hideCtrlT);
            hideCtrlT = setTimeout(function () { pw.classList.remove('show-ctrl'); }, 3000);
        });

        document.addEventListener('click', function (e) {
            if (!e.target.closest('#qw')) closeQ();
        });

        var sv = localStorage.getItem('vol');
        if (sv) {
            vid.volume = parseFloat(sv);
            document.getElementById('vs').value = sv;
        }

        buildChannels();
        load(0, 0);
    </script>
</body>
